# Producción (spaceteam.uma.es): todo en Docker, nginx termina el TLS.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Variables en .env (no se sube a git): ver .env.example. Lo usa deploy_prod.sh.
services:
  frontend:
    ports: !override
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/10-fullchain.sh:/docker-entrypoint.d/10-fullchain.sh:ro
      - ${TLS_CERT_FILE:?define TLS_CERT_FILE en .env}:/certs/cert.cer:ro
      - ${TLS_CHAIN_FILE:?define TLS_CHAIN_FILE en .env}:/certs/chain.cer:ro
      - ${TLS_KEY_FILE:?define TLS_KEY_FILE en .env}:/certs/privkey.key:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 3s
      retries: 3

  inventory-backend:
    # El backend solo se alcanza a través de nginx (/api)
    ports: !override
      - "127.0.0.1:3001:3001"
    environment:
      - JWT_SECRET=${JWT_SECRET:?define JWT_SECRET en .env}
      - FRONTEND_URL=https://spaceteam.uma.es
