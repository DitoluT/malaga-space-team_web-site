# Rutas comunes a desarrollo (nginx.conf) y producción (nginx.prod.conf)

# Serve static assets
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, no-transform";
}

# API Proxy
location /api/ {
    proxy_pass http://inventory-backend:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    # Subida de logos desde /admin (el backend limita a 10 MB)
    client_max_body_size 12m;
}

# Ficheros subidos desde /admin (logos). Se sirven solo como recursos: aunque alguien subiera
# un SVG o HTML con scripts, el navegador no los ejecuta.
location /uploads/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
    expires 30d;
}

# LinkStack (página de enlaces / redes sociales) en /social
location = /social {
    absolute_redirect off;
    return 301 /social/;
}

location /social/ {
    proxy_pass http://linkstack:80;
    proxy_http_version 1.1;
    proxy_set_header Host $linkstack_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Las redirecciones conservan el esquema (https) que ve el visitante
    proxy_redirect ~^https?://([^/]+)(/.*)$ $forwarded_proto://$1$2;
    client_max_body_size 8m;
}

# Inventory App
location /inventario {
    try_files $uri $uri/ /inventario.html;
}

# Web pública (Astro, estática): /, /en, /unete, /en/join...
location / {
    try_files $uri $uri/index.html $uri.html =404;
}

# Recursos con hash de Astro: caché larga
location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

error_page 404 /404.html;
