# Rutas comunes a desarrollo (nginx.conf) y producción (nginx.prod.conf)

# Serve static assets
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, no-transform";
}

# API Proxy
location /api/ {
    proxy_pass http://inventory-backend:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
}

# LinkStack (página de enlaces / redes sociales) en /social
location = /social {
    absolute_redirect off;
    return 301 /social/;
}

location /social/ {
    proxy_pass http://linkstack:80;
    proxy_http_version 1.1;
    proxy_set_header Host $linkstack_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Las redirecciones conservan el esquema (https) que ve el visitante
    proxy_redirect ~^https?://([^/]+)(/.*)$ $forwarded_proto://$1$2;
    client_max_body_size 8m;
}

# Admin Panel
location /admin {
    try_files $uri $uri/ /admin.html;
}

# Inventory App
location /inventario {
    try_files $uri $uri/ /inventario.html;
}

# Main App (Landing)
location / {
    try_files $uri $uri/ /index.html;
}
