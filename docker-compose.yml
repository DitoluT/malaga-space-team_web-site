version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: malaga-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - inventory-backend
      - linkstack
    volumes:
      - uploads_data:/usr/share/nginx/html/uploads
    networks:
      - malaga-network

  inventory-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: malaga-inventory-backend
    ports:
      - "3001:3001"
    volumes:
      # Montar la base de datos para persistencia
      - ./data:/app/data
      # Montar uploads para compartir con frontend
      - uploads_data:/app/public/uploads
    environment:
      - JWT_SECRET=malaga-space-team-secret-key-change-in-production
      - FLASK_ENV=production
      - FRONTEND_URL=http://localhost
    restart: unless-stopped
    networks:
      - malaga-network

  # LinkStack: página de enlaces servida en /social (detrás del nginx del frontend)
  linkstack:
    build:
      context: ./linkstack
    container_name: malaga-linkstack
    environment:
      - TZ=Europe/Madrid
      - SERVER_ADMIN=spaceteam@uma.es
      - HTTP_SERVER_NAME=spaceteam.uma.es
      - HTTPS_SERVER_NAME=spaceteam.uma.es
      - LOG_LEVEL=info
      # Credenciales del admin (solo se usan en el primer arranque).
      # Si no se define la contraseña, se genera una y se muestra en los logs.
      - LINKSTACK_ADMIN_EMAIL=${LINKSTACK_ADMIN_EMAIL:-spaceteam@uma.es}
      - LINKSTACK_ADMIN_PASSWORD=${LINKSTACK_ADMIN_PASSWORD:-}
      # Poner a true si el proxy de delante no envía X-Forwarded-Proto
      - LINKSTACK_FORCE_HTTPS=${LINKSTACK_FORCE_HTTPS:-false}
    volumes:
      # App + base de datos SQLite + subidas (recomendación oficial de LinkStack)
      - linkstack_data:/htdocs
    restart: unless-stopped
    networks:
      - malaga-network

networks:
  malaga-network:
    driver: bridge

volumes:
  uploads_data:
  linkstack_data:
