# nginx de PRODUCCIÓN (spaceteam.uma.es): termina el TLS con el certificado de la UMA.
# Se monta sobre /etc/nginx/nginx.conf desde docker-compose.prod.yml.
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Aquí no hay proxy delante: el esquema es el de la propia conexión
    map $scheme $forwarded_proto {
        default $scheme;
    }

    # HTTP -> HTTPS
    server {
        listen 80 default_server;
        server_name spaceteam.uma.es;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name spaceteam.uma.es;

        # Generado al arrancar por nginx/10-fullchain.sh (certificado + intermedia)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        root /usr/share/nginx/html;
        index index.html;

        # Servicio /reload que corre en el host (puerto 4000), como hacía el Apache
        location /reload {
            proxy_pass http://host.docker.internal:4000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        include /etc/nginx/snippets/locations.conf;
    }
}
