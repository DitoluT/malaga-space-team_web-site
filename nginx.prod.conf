# nginx de PRODUCCIÓN (spaceteam.uma.es).
# El TLS lo termina el proxy inverso de la UMA, que reenvía todo por HTTP al puerto 80
# de este servidor: aquí NO hay certificados ni redirección a https (haría un bucle).
# Se monta sobre /etc/nginx/nginx.conf desde docker-compose.prod.yml.
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # El visitante siempre navega por https://spaceteam.uma.es, llegue lo que llegue aquí
    map $host $forwarded_proto { default https; }
    map $host $linkstack_host  { default spaceteam.uma.es; }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name spaceteam.uma.es;

        root /usr/share/nginx/html;
        index index.html;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # Servicio /reload que corre en el host (puerto 4000), como hacía el Apache
        location /reload {
            proxy_pass http://host.docker.internal:4000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        include /etc/nginx/snippets/locations.conf;
    }
}
