# nginx de PRODUCCIÓN (spaceteam.uma.es).
# Delante está el proxy inverso de la UMA, que termina el TLS público y reenvía:
#   https:// -> puerto 443 de este servidor (re-cifrado, no valida el certificado)
#   http://  -> puerto 80
# y comprueba la salud de AMBOS puertos cada 2 s: si el 443 no responde, devuelve 503.
# Por eso nginx atiende los dos puertos: el 443 sirve la web y el 80 redirige a https://.
# Se monta sobre /etc/nginx/nginx.conf desde docker-compose.prod.yml.
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # El visitante siempre navega por https://spaceteam.uma.es, llegue lo que llegue aquí
    map $host $forwarded_proto { default https; }
    map $host $linkstack_host  { default spaceteam.uma.es; }

    # Puerto 80 (http:// público): todo a HTTPS, para que usuario y contraseña del panel
    # nunca viajen en claro. El proxy de la UMA solo comprueba que el puerto responde.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name spaceteam.uma.es;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 301 https://spaceteam.uma.es$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name spaceteam.uma.es;

        # Generado al arrancar por nginx/10-fullchain.sh (certificado + intermedia)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        root /usr/share/nginx/html;
        index index.html;

        # Servicio /reload que corre en el host (puerto 4000), como hacía el Apache
        location /reload {
            proxy_pass http://host.docker.internal:4000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # reload_website.sh reconstruye las imágenes: puede tardar varios minutos
            proxy_read_timeout 900s;
        }

        include /etc/nginx/snippets/locations.conf;
    }
}
