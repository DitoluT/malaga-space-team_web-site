# LinkStack bajo /social (p. ej. https://spaceteam.uma.es/social)
# Al servirse con Alias, Laravel detecta el prefijo /social y genera
# todas las URLs (assets, login, panel...) con él.
Alias /social /htdocs

# El TLS termina en el proxy: si la petición original era HTTPS,
# marcarla como tal para que LinkStack genere URLs https://
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

<Directory "/htdocs">
    # Las reglas de .htaccess de LinkStack asumen la raíz del dominio,
    # así que se sustituyen por estas equivalentes con el prefijo /social
    AllowOverride None
    Options -MultiViews -Indexes +FollowSymLinks
    Require all granted

    RewriteEngine On
    RewriteBase /social

    # Handle Authorization Header
    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

    # Bloquear ficheros sensibles (.env, base de datos, backups, logs)
    RewriteRule (^|/)\. - [F,L]
    RewriteRule \.(env|sqlite|zip|log)$ - [F,L]

    # Redirect Trailing Slashes If Not A Folder...
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_URI} (.+)/$
    RewriteRule ^ %1 [L,R=301]

    RewriteCond %{REQUEST_URI} !^/social/index\.php$
    RewriteRule \.php$ - [F,L]

    # Send Requests To Front Controller...
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ index.php [L]
</Directory>
